<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Luzzzen Cards</title>
  <meta name="description" content="Catálogo de cartas de fútbol coleccionables, firmas, jerseys y accesorios.">
  <meta name="theme-color" content="#05090f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body data-pagina="catalogo">
<main class="envoltura">

  <div class="catalogo-cabecera">
    <h1 id="titulo-catalogo">Todo el catálogo</h1>
  </div>

  <form class="barra-filtros" id="filtros" role="search" onsubmit="return false">
    <label class="filtro filtro-busqueda">
      <span class="oculto-visual">Buscar</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm9 16-4-4"/></svg>
      <input type="search" name="q" placeholder="Buscá jugador o equipo" autocomplete="off">
    </label>

    <!-- En el celu es un panel que sube desde abajo; en compu se muestra en línea -->
    <div class="panel-fondo" id="panel-fondo" hidden></div>
    <div class="panel-filtros" id="panel-filtros" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
      <div class="panel-cabecera">
        <h2 id="panel-titulo">Filtros</h2>
        <button type="button" class="icono-boton" id="cerrar-filtros" aria-label="Cerrar filtros"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="panel-cuerpo">
        <label class="filtro">
          <span>Categoría</span>
          <select name="cat" id="f-cat"></select>
        </label>
        <label class="filtro">
          <span>Jugador</span>
          <select name="jugador" id="f-jugador"></select>
        </label>
        <label class="filtro">
          <span>Equipo</span>
          <select name="equipo" id="f-equipo"></select>
        </label>
        <label class="filtro">
          <span>Selección</span>
          <select name="sel" id="f-sel"></select>
        </label>
        <div class="filtro filtro-precio">
          <span>Precio</span>
          <div class="rango">
            <input name="min" type="number" inputmode="numeric" min="0" step="500" placeholder="Desde" aria-label="Precio desde">
            <input name="max" type="number" inputmode="numeric" min="0" step="500" placeholder="Hasta" aria-label="Precio hasta">
          </div>
        </div>
        <label class="casilla"><input type="checkbox" id="solo-disponibles"> Ocultar vendidas</label>
      </div>
      <div class="panel-pie">
        <button type="button" class="boton boton-secundario" id="limpiar">Limpiar</button>
        <button type="button" class="boton" id="ver-resultados">Ver resultados</button>
      </div>
    </div>
  </form>

  <div class="barra-herramientas">
    <button type="button" class="boton boton-secundario" id="abrir-filtros" aria-expanded="false" aria-controls="panel-filtros">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"/></svg>
      Filtros<span class="cuenta-filtros" id="cuenta-filtros" hidden></span>
    </button>
    <label class="oculto-visual" for="orden">Ordenar</label>
    <select id="orden">
      <option value="recientes">Más nuevas</option>
      <option value="antiguas">Más viejas</option>
      <option value="precio-asc">Menor precio</option>
      <option value="precio-desc">Mayor precio</option>
    </select>
    <p class="resultados" id="resultados" aria-live="polite">&nbsp;</p>
  </div>

  <h2 class="oculto-visual">Productos</h2>
  <div class="grilla" id="grilla">
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
  </div>
  <nav class="paginacion" id="paginacion" aria-label="Páginas"></nav>

</main>

<script src="js/config.js"></script>
<script src="js/comun.js"></script>
<script src="js/datos.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
